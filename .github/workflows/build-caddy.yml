name: Build caddy image
# Builds the custom Caddy image (Caddy + caddy-dns/cloudflare, compiled via
# xcaddy) and pushes it to ghcr.io/<owner>/caddy. The OS image binds this image
# as a bootc logically bound image, so it must exist in the registry by the time
# a host runs `bootc upgrade`.
on:
  pull_request:
    branches:
      - main
    paths:
      - quadlets/caddy/Containerfile
      - .github/workflows/build-caddy.yml
  schedule:
    - cron: '05 9 * * *'  # rebuild daily to pick up caddy/base updates
  push:
    branches:
      - main
    paths:
      - quadlets/caddy/Containerfile
      - .github/workflows/build-caddy.yml
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "caddy"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push caddy image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@5d8479758cc72ed82df28daba521d27e20ff8c8a # v3
        with:
          containerfiles: |
            ./quadlets/caddy/Containerfile
          context: ./quadlets/caddy
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          oci: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
