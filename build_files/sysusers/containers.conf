# Owner of the subordinate ID ranges that podman's UserNS=auto hands out
# (see /etc/subuid and /etc/subgid in build.sh). Since shadow-utils 4.20
# (Fedora 45), libsubid only returns ranges for a user that exists in passwd,
# so without this user every UserNS=auto pod fails with "not enough unused
# IDs in user namespace".
u containers - "Podman UserNS=auto ranges" / /usr/sbin/nologin
