# Cloudflare Tunnel config for home-os.
# Only books.babariviere.com, curator.babariviere.com (/proxy only) and
# libook.club are exposed. Everything else 404s here and, more importantly, no
# other hostname has a public CNAME pointing at this tunnel.
#
# One-time setup on the host (creates the tunnel + credentials + DNS record):
#   cloudflared tunnel login
#   cloudflared tunnel create home-os
#   cloudflared tunnel route dns home-os books.babariviere.com
#   podman secret create cloudflared-creds ~/.cloudflared/<TUNNEL_UUID>.json
# Then put the tunnel UUID below.
tunnel: 07981e73-faee-4331-a7e8-ce3641b7a0b6
credentials-file: /etc/cloudflared/creds.json

# No inbound ports; cloudflared dials out to the Cloudflare edge.
ingress:
  # Forward to Caddy's books-only listener (see quadlets/caddy/Caddyfile :8080).
  # Plaintext is fine: TLS is terminated at the Cloudflare edge and this hop
  # stays inside the caddy podman network.
  - hostname: books.babariviere.com
    service: http://caddy:8080
  # Forward to Caddy's curator proxy-only listener (see the Caddyfile :8081).
  # Only /proxy/{token} is served there: curator's other routes stay on the LAN.
  # BookOrbit has to fetch assembled Suwayomi releases over a public address,
  # because it refuses any download URL resolving to a private one, and it
  # counts Tailscale's CGNAT range as private.
  - hostname: curator.babariviere.com
    service: http://caddy:8081
  # libook, the shared library. Served by libook itself (it sets its own
  # headers and rate limit), straight over the caddy network: Caddy's wildcard
  # certificate is for babariviere.com, and the tunnel needs no TLS inside.
  - hostname: libook.club
    service: http://libook:8080
    originRequest:
      # The Kobo sync and uploads can be slow on a bad line.
      connectTimeout: 30s
  # Refuse anything else.
  - service: http_status:404
